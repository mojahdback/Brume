<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/toastify-js@1.12.0/src/toastify.min.css"
    />
    <style type="text/tailwindcss">
      @theme {
        --color-brume-cream: #faf6ee;
        --color-brume-green: #3b4f35;
        --color-brume-green-dark: #2c3c28;
        --color-brume-beige: #e8dcc8;
        --color-brume-sage: #e8edda;
        --color-brume-line: #e6dfd1;
        --color-brume-muted: #7a7060;
        --color-brume-ink: #2e2a22;
      }
    </style>
  </head>

  <body class="bg-brume-cream text-brume-ink">
    <div class="flex min-h-screen">
      <aside
        class="hidden w-64 shrink-0 flex-col gap-8 border-r border-brume-line bg-white p-6 md:flex"
      >
        <div class="flex items-center gap-2">
          <img src="assetes/icons/Brume.png" alt="" class="h-6" />
          <span class="font-serif text-2xl">BRUME</span>
        </div>

        <nav class="flex flex-col gap-1 text-sm">
          <a
            href="#"
            class="rounded-xl px-4 py-3 text-brume-muted hover:bg-brume-sage"
            >Tableau de bord</a
          >
          <a
            href="#"
            class="rounded-xl bg-brume-sage px-4 py-3 font-medium text-brume-green"
            >Produits</a
          >
          <a
            href="#"
            class="rounded-xl px-4 py-3 text-brume-muted hover:bg-brume-sage"
            >Commandes</a
          >
          <a
            href="#"
            class="rounded-xl px-4 py-3 text-brume-muted hover:bg-brume-sage"
            >Clients</a
          >
          <a
            href="#"
            class="rounded-xl px-4 py-3 text-brume-muted hover:bg-brume-sage"
            >Paramètres</a
          >
        </nav>

        <p class="mt-auto text-xs text-brume-muted">Back-office · BRUME</p>
      </aside>

      <div class="min-w-0 flex-1">
         <!-- ================= HEADER ================= -->
        <header
          class="flex items-center justify-between border-b border-brume-line bg-white px-6 py-4 md:px-10"
        >
          <div>
            <p class="text-xs text-brume-muted">Produits / Création</p>
            <h1 class="font-serif text-2xl">Nouveau produit</h1>
          </div>
          <div class="flex items-center gap-3 text-sm">
            <span class="hidden text-brume-muted sm:block">Admin BRUME</span>
            <span class="flex h-9 w-9 items-center justify-center rounded-full bg-brume-green text-xs text-white">AD</span>
          </div>
        </header>

        <main></main>
      </div>
    </div>
  </body>
</html>
